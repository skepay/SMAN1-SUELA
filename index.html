<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Data Diri</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
        color: #1f2937;
        background: #f8fafc;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      .card {
        max-width: 760px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      }
      h1 {
        margin-top: 0;
        font-size: 1.4rem;
      }
      fieldset {
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 16px;
      }
      legend {
        font-weight: 700;
        padding: 0 8px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 16px;
      }
      .full {
        grid-column: 1 / -1;
      }
      label {
        font-weight: 600;
        font-size: 0.95rem;
        display: block;
        margin-bottom: 6px;
      }
      input,
      textarea,
      select {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 10px;
        font-size: 0.95rem;
      }
      textarea {
        resize: vertical;
        min-height: 88px;
      }
      .hint {
        margin-top: 6px;
        font-size: 0.8rem;
        color: #6b7280;
      }
      @media (max-width: 640px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Form Pendaftaran</h1>
      <fieldset>
        <legend>Alamat Lengkap</legend>
        <div class="grid">
          <div class="full">
            <label for="alamat-jalan">Alamat Jalan</label>
            <textarea
              id="alamat-jalan"
              name="alamat_jalan"
              placeholder="Contoh: Jl. Merdeka No. 10, Blok B"
              required
            ></textarea>
          </div>

          <div>
            <label for="rt">RT</label>
            <input id="rt" name="rt" type="text" inputmode="numeric" maxlength="3" placeholder="001" required />
          </div>

          <div>
            <label for="rw">RW</label>
            <input id="rw" name="rw" type="text" inputmode="numeric" maxlength="3" placeholder="002" required />
          </div>

          <div>
            <label for="kelurahan">Kelurahan / Desa</label>
            <input id="kelurahan" name="kelurahan" type="text" placeholder="Nama kelurahan/desa" required />
          </div>

          <div>
            <label for="kecamatan">Kecamatan</label>
            <input id="kecamatan" name="kecamatan" type="text" placeholder="Nama kecamatan" required />
          </div>

          <div>
            <label for="kota">Kota / Kabupaten</label>
            <input id="kota" name="kota" type="text" placeholder="Nama kota/kabupaten" required />
          </div>

          <div>
            <label for="provinsi">Provinsi</label>
            <select id="provinsi" name="provinsi" required>
              <option value="" selected disabled>Pilih provinsi</option>
              <option>Aceh</option>
              <option>Bali</option>
              <option>Banten</option>
              <option>DKI Jakarta</option>
              <option>Jawa Barat</option>
              <option>Jawa Tengah</option>
              <option>Jawa Timur</option>
              <option>DI Yogyakarta</option>
              <option>Kalimantan Timur</option>
              <option>Lainnya</option>
            </select>
          </div>

          <div>
            <label for="kode-pos">Kode Pos</label>
            <input id="kode-pos" name="kode_pos" type="text" inputmode="numeric" maxlength="5" placeholder="12345" required />
            <p class="hint">Isi 5 digit kode pos sesuai wilayah domisili.</p>
          </div>
        </div>
      </fieldset>
    </main>
  </body>
</html>
